services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # One-shot runner:  docker compose run --rm pipeline [args]
  pipeline:
    build: .
    profiles: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &appenv
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/app

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone          # SQLite metadata DB; fine for a lab, not for production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *appenv
      PYTHONPATH: /opt/airflow/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/airflow/project

volumes:
  pgdata:
