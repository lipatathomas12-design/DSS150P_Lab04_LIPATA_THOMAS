paths:                    
  source_csv: data/raw/bgg_dataset.csv
  manifest: source_manifest.yml
  contract: config/data_contract.yml
  baseline: config/baseline_metrics.json
  raw: data/raw/bgg_raw.parquet
  staging: data/staging/bgg_staging.parquet
  curated: data/curated/bgg_curated.parquet
  model_ready: data/curated/bgg_model_ready.parquet
  outputs: outputs
  state: state
  logs: logs

ingestion:
  incremental_batch_size: 5000  

features:
  current_year: 2026            
  top_mechanics: 20
  outlier_columns: [Play Time, Min Age, Users Rated, Complexity Average, Owned Users]

target:
  bins: [0.0, 6.0, 7.5, 10.0]
  labels: [Low, Medium, High]

split:
  test_size: 0.2
  random_state: 42

model:
  name: GradientBoostingClassifier
  params:                        
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 3
    subsample: 0.8
    random_state: 42

reproducibility:
  primary_metric: accuracy
  accuracy_tolerance: 0.01
  weighted_f1_tolerance: 0.01

database:
  enabled: true